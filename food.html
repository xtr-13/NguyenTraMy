<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Food</title>

  <link rel="stylesheet" href="food.css" />
</head>

<body>

  <div id="foodquestion">
    <b>bbi muốn ăn gì nào </b>
  </div>

  <div class="food-selection">

    <div class="food-item">
      <img src="https://statics.vincom.com.vn/xu-huong/Bun-ngan-tron-doc-quyen.jpeg">

    </div>

    <div class="food-item">
      <img src="https://tse2.mm.bing.net/th/id/OIP.8z53M_jG9LcdebseHjSOuwHaEK?pid=Api&h=220&P=0">
      <label>
        <input type="checkbox" name="food" value="Cơm tấm">
        Cơm tấm
      </label>
    </div>

    <div class="food-item">
      <img src="https://i.ytimg.com/vi/5HkPnkG4RR8/maxresdefault.jpg">
      <label>
        <input type="checkbox" name="food" value="Sườn xào chua ngọt">
        Sườn xào chua ngọt
      </label>
    </div>

    <div class="food-item">
      <img src="https://cdn.tgdd.vn/Files/2020/11/26/1309459/cam-nang-cac-mon-canh-tu-xuong-heo-ngon-mieng-de-nau-nhat-202011261552326638.jpg">
      <label>
        <input type="checkbox" name="food" value="Canh xương">
        Canh xương
      </label>
    </div>

    <div class="food-item">
      <img src="https://beplorca.com.vn/wp-content/uploads/2025/10/Canh-cua-vnexpress-1756286225-8516-1756286355-e1760339885806.webp">
      <label>
        <input type="checkbox" name="food" value="Canh cua rau đay">
        Canh cua rau đay
      </label>
    </div>

    <div class="food-item">
      <img src="https://afamilycdn.com/150157425591193600/2022/7/13/94c39b1f-9859-402b-bae7-ff38d5d8360d-16577021217241716174428.jpg">
      <label>
        <input type="checkbox" name="food" value="Thịt rang cháy cạnh">
      Thịt rang cháy cạnh
      </label>
    </div>

    <div class="food-item">
      <img src="https://daotaobeptruong.vn/wp-content/uploads/2022/04/cach-lam-xa-xiu-bang-goi-gia-vi.jpg">
      <label>
        <input type="checkbox" name="food" value="Thịt nướng xá xíu">
        Thịt nướng xá xíu
      </label>
    </div>

    <div class="food-item">
      <img src="https://www.lorca.vn/wp-content/uploads/2025/04/1-34.jpg">
      <label>
        <input type="checkbox" name="food" value="Chả lá lốt">
        Chả lá lốt
      </label>
    </div>
    <div class="food-item">
  <label>
    <input type="checkbox" name="food" value="Món khác" id="otherFoodCheck">
    Món khác:
  </label>

  <input 
    type="text" 
    id="otherFoodInput" 
    placeholder="A Đam oder món khác:..."
    style="display: none;"
  >
</div>

  </div>

  <br>

  <button class="button" onclick="sendFood()">
    Gửi cho anh
  </button>

  <!-- EMAILJS -->
 <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

  // ==========================
  // KHỞI TẠO EMAILJS
  // ==========================

  emailjs.init("_5gTYYeDHpz4pJYrQ");


  // ==========================
  // MÓN KHÁC - HIỆN Ô NHẬP
  // ==========================

  document
    .getElementById("otherFoodCheck")
    .addEventListener("change", function () {

      const otherFoodInput =
        document.getElementById("otherFoodInput");


      // Nếu chọn "Món khác"
      if (this.checked) {

        otherFoodInput.style.display = "block";

        // Đưa con trỏ vào ô nhập
        otherFoodInput.focus();

      }

      // Nếu bỏ chọn "Món khác"
      else {

        otherFoodInput.style.display = "none";

        // Xóa nội dung đã nhập
        otherFoodInput.value = "";

      }

    });


  // ==========================
  // GỬI MÓN ĂN
  // ==========================

  function sendFood() {

    const selectedFoods = [];


    // ==========================
    // KIỂM TRA MÓN KHÁC
    // ==========================

    const otherFoodCheck =
      document.getElementById("otherFoodCheck");

    const otherFoodInput =
      document.getElementById("otherFoodInput");


    // Nếu đã chọn "Món khác"
    if (otherFoodCheck && otherFoodCheck.checked) {

      const otherFood =
        otherFoodInput.value.trim();


      // Chưa nhập món
      if (otherFood === "") {

        alert("Trà My có thể oder món khác:");

        otherFoodInput.focus();

        return;

      }

    }


    // ==========================
    // LẤY CÁC MÓN ĐÃ CHỌN
    // ==========================

    document
      .querySelectorAll('input[name="food"]:checked')
      .forEach((food) => {


        // Nếu là Món khác
        if (food.id === "otherFoodCheck") {

          const otherFood =
            otherFoodInput.value.trim();

          selectedFoods.push(otherFood);

        }


        // Nếu là món có sẵn
        else {

          selectedFoods.push(food.value);

        }

      });


    // ==========================
    // NẾU CHƯA CHỌN MÓN
    // ==========================

    if (selectedFoods.length === 0) {

      alert("Trà My");

      return;

    }


    // ==========================
    // NỘI DUNG GỬI EMAIL
    // ==========================

    const templateParams = {

      girl_name: "Bé iu",

      date_choice:
        "Bbi muốn ăn: " +
        selectedFoods.join(", ")

    };


    // ==========================
    // GỬI EMAIL
    // ==========================

    emailjs.send(
      "service_5pdh7mi",
      "template_s845ep8",
      templateParams
    )

 .then(function () {

  alert("Anh note món cho A Đam rồi nhé ❤️");

})
    .catch(function (error) {

      console.log(error);

      alert("Gửi thất bại!");

    });

  }

</script>

</body>

</html>
